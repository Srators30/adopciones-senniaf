name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # El token de SonarCloud se lee aqui, a nivel del trabajo, para poder
    # preguntar en el paso de analisis si existe. Si no se configuro, ese
    # paso se salta y la tuberia sigue en verde.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4
        with:
          # SonarCloud necesita el historial completo para saber que
          # lineas son nuevas en cada cambio.
          fetch-depth: 0

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar, ejecutar pruebas y medir cobertura
        run: mvn -B clean verify

      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas-junit
          path: target/surefire-reports/

      # Sprint 6: el reporte de JaCoCo queda como artefacto descargable de
      # cada ejecucion. Abrir index.html dentro del zip.
      - name: Publicar reporte de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-jacoco
          path: target/site/jacoco/

      # Sprint 6: analisis estatico en SonarCloud. Se activa solo cuando el
      # repositorio tiene el secreto SONAR_TOKEN y las variables
      # SONAR_ORGANIZATION y SONAR_PROJECT_KEY (ver INSTRUCCIONES.md).
      - name: Analisis estatico (SonarCloud)
        if: ${{ env.SONAR_TOKEN != '' }}
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
