# === Base de datos (H2 en memoria para el MVP / Sprint 1) ===
spring.datasource.url=jdbc:h2:mem:adopcionesdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Consola H2 solo para verificacion en desarrollo (deshabilitar antes de produccion)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# === JWT ===
# IMPORTANTE: en un entorno real este secreto debe venir de una variable de entorno,
# nunca debe quedar escrito en el repositorio.
app.jwt.secret=CambiarEsteSecretoPorUnoSeguroDeAlMenos32CaracteresSENNIAF
app.jwt.expiration-minutes=60

spring.application.name=adopciones-senniaf
