# === Base de datos ===================================================
# Desde el Sprint 3 la base es un archivo y no memoria: los expedientes
# y los documentos tienen que sobrevivir a un reinicio.
# Agregar "data/" al .gitignore: contiene datos de prueba.
spring.datasource.url=jdbc:h2:file:./data/adopcionesdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Consola H2 solo para verificacion en desarrollo (deshabilitar antes de produccion)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# === JWT =============================================================
# IMPORTANTE: en un entorno real este secreto debe venir de una variable
# de entorno, nunca debe quedar escrito en el repositorio.
app.jwt.secret=CambiarEsteSecretoPorUnoSeguroDeAlMenos32CaracteresSENNIAF
app.jwt.expiration-minutes=60

# === Documentos (HU-04) ==============================================
# Carpeta donde quedan los archivos YA CIFRADOS. Agregar tambien
# "data/documentos/" al .gitignore.
app.documentos.ruta=./data/documentos

# Clave con la que se cifra cada documento (AES-256-GCM). Vale lo mismo
# que para el secreto del JWT: en produccion va en variable de entorno.
# Si esta clave se pierde, los documentos ya guardados no se pueden
# volver a leer; si se filtra, cualquiera con la carpeta puede leerlos.
app.documentos.clave=CambiarEstaClaveDeDocumentosPorUnaSeguraSENNIAF

# Tamano maximo por archivo, en MB. Debe ir acompanado de los limites
# de Spring: si solo se sube este, Tomcat rechaza antes con 413.
app.documentos.max-mb=10
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

spring.application.name=adopciones-senniaf
